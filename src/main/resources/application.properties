# ===================================================
# DATABASE - Neon PostgreSQL
# ===================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuning for Neon (serverless - has cold starts)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Neon requires this to keep connections alive
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ===================================================
# JPA / HIBERNATE
# ===================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# CRITICAL SETTING:
# - "create"      : Drops and recreates all tables on every startup. Use ONLY for first-time setup.
# - "update"      : Adds new columns/tables but never drops. Safe for production.
# - "validate"    : Just validates schema matches entities. Safest for production.
# - "create-drop" : Like "create" but drops on shutdown. Use for tests only.
#
# For YOUR situation: use "update" so tables are created if missing, but data is preserved.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# IMPORTANT for Neon / PostgreSQL: prevents "relation does not exist" errors
spring.jpa.properties.hibernate.default_schema=public

# Batch inserts for faster seeding
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===================================================
# JWT
# ===================================================
jwt.secret=${JWT_SECRET:ZGVmYXVsdC1iYXNlNjQtc2VjcmV0LXNob3VsZC1iZS02NGJ5dGVzLWZvci1kZXY=}
jwt.expiration.ms=86400000

# ===================================================
# LOGGING - Enable during debugging, disable in prod
# ===================================================
logging.level.com.reactorx=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# ===================================================
# ACTUATOR
# ===================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
