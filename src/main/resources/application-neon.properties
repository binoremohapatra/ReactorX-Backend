# Neon PostgreSQL Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-soft-dust-123456.us-east-2.aws.neon.tech/dbname?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:your_username}
spring.datasource.password=${DATABASE_PASSWORD:your_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration for Neon - Optimized for Performance
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
# Disable leak detection to avoid performance issues
spring.datasource.hikari.leak-detection-threshold=0

# Fix PostgreSQL autoCommit issue
spring.datasource.hikari.auto-commit=false

# JPA/Hibernate Configuration for Neon
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false

# Performance Optimizations - Enhanced for Speed
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# SSL Configuration for Neon
spring.datasource.properties.ssl=true
spring.datasource.properties.sslmode=require

# Fix autoCommit issue for PostgreSQL
spring.datasource.properties.autoReconnect=true
spring.datasource.properties.useSSL=true
spring.datasource.properties.useUnicode=true
spring.datasource.properties.characterEncoding=UTF-8

# Application Settings
app.allow-registration=true

# JWT Settings
jwt.secret=${JWT_SECRET:ZGVmYXVsdC1iYXNlNjQtc2VjcmV0LWZvci1uZW9uLXRlc3Rpbmctb25seQ==}
jwt.expiration.ms=86400000

# Logging Configuration
logging.level.org.springframework.security=WARN
logging.level.com.reactorx=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
