# Development Configuration with Neon PostgreSQL
# This file is automatically picked up when SPRING_PROFILES_ACTIVE=dev

# ===================================================
# DATABASE - Neon PostgreSQL
# ===================================================
spring.datasource.url=jdbc:postgresql://ep-spring-term-ad90lzux-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_xDNXuZqYy13T
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuning for Neon (serverless - has cold starts)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Neon requires this to keep connections alive
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ===================================================
# JPA / HIBERNATE
# ===================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# IMPORTANT for Neon / PostgreSQL: prevents "relation does not exist" errors
spring.jpa.properties.hibernate.default_schema=public

# Batch inserts for faster seeding
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===================================================
# JWT
# ===================================================
jwt.secret=ZmFrZS1zZWNyZXQta2V5LWZvci1kZW1vLXB1cnBvc2VzLW9ubHktcmVwbGFjZS13aXRoLXJlYWwtNTEyLWJpdC1rZXk=
jwt.expiration.ms=86400000

# ===================================================
# LOGGING
# ===================================================
logging.level.com.reactorx=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# ===================================================
# ACTUATOR
# ===================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
